[project]
name = "textproof"
version = "0.1.0"
description = "批量校对命令行工具：检查成组文本的一致性"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
textproof = "textproof.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
